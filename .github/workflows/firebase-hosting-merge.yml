# Publica la web en Firebase Hosting cada vez que se hace push a main.
name: Publicar en Firebase (main)
on:
  push:
    branches: [main]
  workflow_dispatch: {}  # permite publicar a mano desde la pestaña Actions
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TIENE_SECRETO: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Aviso si falta configurar Firebase
        if: env.TIENE_SECRETO != 'true'
        run: echo "Falta el secreto FIREBASE_SERVICE_ACCOUNT. No se publica todavía."
      - if: env.TIENE_SECRETO == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: dymcom-98c14
