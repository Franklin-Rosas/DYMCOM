# Crea una vista previa (link temporal) en cada pull request.
name: Vista previa en Firebase (pull request)
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  preview:
    # Solo para pull requests de este mismo repositorio (no de copias ajenas)
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    env:
      TIENE_SECRETO: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Aviso si falta configurar Firebase
        if: env.TIENE_SECRETO != 'true'
        run: echo "Falta el secreto FIREBASE_SERVICE_ACCOUNT. No se publica todavía."
      - if: env.TIENE_SECRETO == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          expires: 7d
          projectId: dymcom-98c14
